name: Test controlled incident fixture
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m ghost_replay demo --repeats 5 --output report.json
      - run: python -m ghost_replay capture --bundle examples/checkout-race.json --output evidence-v2.json
      - run: python -m ghost_replay inspect-bundle --bundle evidence-v2.json
      - run: python -m ghost_replay evidence-demo --repeats 5 --output evidence-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: reproduction-${{ matrix.python }}
          path: |
            report.json
            evidence-v2.json
            evidence-report.json
